name: Update Project Progress

on:
  push:
    branches:
      - progressbar
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      OWNER: "CSE499-Senior-Project" 
      PROJECT_NUMBER: 2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: progressbar

      - name: Calculate Project Progress
        id: calc
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          echo "Fetching project data from GitHub API..."
          
          RESPONSE=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              organization(login: $owner) {
                projectV2(number: $number) {
                  items(first: 100) {
                    nodes {
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -F number=$PROJECT_NUMBER)

          TOTAL=$(echo "$RESPONSE" | jq '[.data.organization.projectV2.items.nodes[]] | length')
          DONE=$(echo "$RESPONSE" | jq '[.data.organization.projectV2.items.nodes[] | select(.fieldValueByName.name == "Done")] | length')

          echo "Total items: $TOTAL"
          echo "Completed items (Done): $DONE"

          if [ "$TOTAL" -eq 0 ]; then
            PERCENTAGE=0
          else
            PERCENTAGE=$(( DONE * 100 / TOTAL ))
          fi

          echo "Progress: $PERCENTAGE%"
          echo "percent=$PERCENTAGE" >> $GITHUB_OUTPUT

      - name: Generate and Update Progress Bar
        run: |
          PERCENT=${{ steps.calc.outputs.percent }}
          BAR_IMG="![](https://geps.dev/progress/$PERCENT)"
          
          awk -v img="$BAR_IMG" '
            // { 
              print
              print ""
              print img
              print ""
              skip=1
              next 
            }
            // { skip=0 }
            !skip { print }
          ' README.md > temp.md && mv temp.md README.md

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update project progress bar to ${{ steps.calc.outputs.percent }}%"
          branch: progressbar
