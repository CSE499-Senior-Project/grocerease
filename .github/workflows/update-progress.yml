name: Update Project Progress

on:
  push:
    branches:
      - progressbar
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      OWNER: "CSE499-Senior-Project" 
      PROJECT_NUMBER: 2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: progressbar

      - name: Calculate Project Progress
        id: calc
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          echo "Fetching project data from GitHub API..."
          
          RESPONSE=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              organization(login: $owner) {
                projectV2(number: $number) {
                  items(first: 100) {
                    nodes {
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -F number=$PROJECT_NUMBER)

          TOTAL=$(echo "$RESPONSE" | jq '[.data.organization.projectV2.items.nodes[]] | length')
          DONE=$(echo "$RESPONSE" | jq '[.data.organization.projectV2.items.nodes[] | select(.fieldValueByName.name == "Done")] | length')

          echo "Total items: $TOTAL"
          echo "Completed items (Done): $DONE"

          if [ "$TOTAL" -eq 0 ]; then
            PERCENTAGE=0
          else
            PERCENTAGE=$(( DONE * 100 / TOTAL ))
          fi

          echo "Progress: $PERCENTAGE%"
          echo "percent=$PERCENTAGE" >> $GITHUB_OUTPUT

      - name: Generate and Update Progress Bar
        run: |
          PERCENT=${{ steps.calc.outputs.percent }}
          export BAR_IMG="![](https://geps.dev/progress/$PERCENT)"
          
          python3 -c '
          import os, re
          
          # Read the current README
          with open("README.md", "r") as f: 
              content = f.read()
              
          # 1. NUKE FROM ORBIT: Erase everything from "# Project Roadmap" downwards. 
          # This instantly deletes all duplicate tags, images, and glitches.
          clean_content = re.sub(r"# Project Roadmap.*", "", content, flags=re.DOTALL).rstrip()
          
          # 2. REBUILD: Create one perfect, clean section
          new_section = "\n\n# Project Roadmap\n\nCurrent Progress:\n\n" + os.environ["BAR_IMG"] + "\n\n"
          
          # 3. WRITE: Save the file
          with open("README.md", "w") as f: 
              f.write(clean_content + new_section)
          '

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update project progress bar to ${{ steps.calc.outputs.percent }}%"
          branch: progressbar